<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#0b0f14">

        <meta name="description"
            content="Timdeiz Incendie - Plateforme IoT de détection et supervision incendie">

    <link rel="manifest"
          href="manifest.webmanifest">

    <link rel="stylesheet"
          href="style.css">

    <title>Timdeiz Incendie — Connexion</title>

</head>


<body class="auth-page">


<!-- =========================================================
     CONTENEUR AUTHENTIFICATION
========================================================= -->

<main class="auth-container">


    <!-- =====================================================
         LOGO
    ====================================================== -->

    <div class="auth-brand">

        <div class="auth-logo">
            <img src="icons/logo.png.jpeg"
                 alt="Logo Timdeiz Incendie">
        </div>

    </div>


    <!-- =====================================================
         CARTE AUTHENTIFICATION
    ====================================================== -->

    <div class="auth-card">


        <!-- =================================================
             CONNEXION
        ================================================== -->

        <section id="loginForm"
                 class="auth-form-container">

            <div class="auth-header">

                <h2>
                    Connexion
                </h2>

                <p>
                    Accédez à votre espace de supervision.
                </p>

            </div>


            <form>

                <!-- EMAIL -->

                <div class="form-group">

                    <label for="loginEmail">
                        Adresse email
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        name="email"
                        placeholder="exemple@email.com"
                        autocomplete="email"
                        required>

                </div>


                <!-- MOT DE PASSE -->

                <div class="form-group">

                    <label for="loginPassword">
                        Mot de passe
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        name="password"
                        placeholder="Votre mot de passe"
                        autocomplete="current-password"
                        required>

                </div>

                <div class="auth-options">
                    <label>
                        <input type="checkbox" name="remember">
                        <span>Se souvenir de moi</span>
                    </label>

                    <button type="button" class="auth-link auth-forgot"
                            onclick="showToast('Contactez votre administrateur pour réinitialiser votre mot de passe.')">
                        Mot de passe oublié ?
                    </button>
                </div>


                <!-- CONNEXION -->

                <button
                    type="submit"
                    id="loginButton"
                    class="auth-button">

                    Se connecter

                </button>

            </form>


            <!-- INSCRIPTION -->

            <div class="auth-switch">

                <span>
                    Vous n'avez pas encore de compte ?
                </span>

                <button
                    type="button"
                    id="showRegister"
                    class="auth-link">

                    Créer un compte

                </button>

            </div>

        </section>



        <!-- =================================================
             INSCRIPTION
        ================================================== -->

        <section id="registerForm"
                 class="auth-form-container"
                 style="display: none;">

            <div class="auth-header">

                <h2>
                    Créer un compte
                </h2>

                <p>
                    Inscrivez-vous pour accéder à votre espace Timdeiz Incendie.
                </p>

            </div>


            <form>

                <!-- NOM -->

                <div class="form-group">

                    <label for="registerName">
                        Nom complet
                    </label>

                    <input
                        type="text"
                        id="registerName"
                        name="name"
                        placeholder="Votre nom complet"
                        autocomplete="name"
                        required>

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="registerEmail">
                        Adresse email
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        name="email"
                        placeholder="exemple@email.com"
                        autocomplete="email"
                        required>

                </div>


                <!-- MOT DE PASSE -->

                <div class="form-group">

                    <label for="registerPassword">
                        Mot de passe
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        name="password"
                        placeholder="Minimum 6 caractères"
                        autocomplete="new-password"
                        minlength="6"
                        required>

                </div>


                <!-- CONFIRMATION -->

                <div class="form-group">

                    <label for="registerPasswordConfirm">
                        Confirmer le mot de passe
                    </label>

                    <input
                        type="password"
                        id="registerPasswordConfirm"
                        name="password_confirm"
                        placeholder="Répétez votre mot de passe"
                        autocomplete="new-password"
                        minlength="6"
                        required>

                </div>


                <!-- INSCRIPTION -->

                <button
                    type="submit"
                    id="registerButton"
                    class="auth-button">

                    S'inscrire

                </button>

            </form>


            <!-- RETOUR LOGIN -->

            <div class="auth-switch">

                <span>
                    Vous avez déjà un compte ?
                </span>

                <button
                    type="button"
                    id="showLogin"
                    class="auth-link">

                    Se connecter

                </button>

            </div>

        </section>

    </div>


    <!-- =====================================================
         INFORMATIONS
    ====================================================== -->

    <div class="auth-footer">

        <span>
            🔒 Connexion sécurisée
        </span>

        <span>
            •
        </span>

        <span>
            Timdeiz Incendie
        </span>

    </div>

</main>


<!-- =========================================================
     TOAST
========================================================= -->

<div id="toast"
     class="toast">
</div>


<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script src="app.js"></script>


<!-- =========================================================
     SERVICE WORKER
========================================================= -->

<script>

    if ("serviceWorker" in navigator) {

        window.addEventListener("load", function () {

            navigator.serviceWorker
                .register("./sw.js")
                .then(function (registration) {

                    console.log(
                        "✅ Service Worker enregistré :",
                        registration.scope
                    );

                })
                .catch(function (error) {

                    console.error(
                        "❌ Erreur Service Worker :",
                        error
                    );

                });

        });

    }

</script>


</body>

</html>
