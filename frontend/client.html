<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timdeiz Incendie - Espace Client</title>
    <link rel="stylesheet" href="style.css"> <!-- Votre fichier CSS -->
    <style>
        /* Style minimaliste sombre inspiré de la photo */
        body { background-color: #0f172a; color: #ffffff; font-family: sans-serif; padding: 20px; }
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background-color: #1e293b; padding: 20px; border-radius: 8px; text-align: center; border: 1px solid #334155; }
        .value { font-size: 2rem; font-weight: bold; margin-top: 10px; color: #38bdf8; }
        .badge { display: inline-block; padding: 8px 15px; border-radius: 5px; font-weight: bold; margin-top: 10px; }
        .badge-success { background-color: #16a34a; color: white; }
        .badge-danger { background-color: #dc2626; color: white; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .client-brand {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 8px;
        }
        .client-brand img {
            width: 72px;
            height: 72px;
            border-radius: 12px;
            object-fit: cover;
        }
        .client-brand h1 {
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="client-brand">
        <img src="icons/logo.png.jpeg" alt="Logo Timdeiz Incendie">
        <h1>TIMDEIZ INCENDIE - Suivi Client</h1>
    </div>
    <p>Données mis à jour en temps réel (chaque seconde)</p>

    <div class="dashboard">
        <!-- 1. Température -->
        <div class="card">
            <h3>Température</h3>
            <div id="client-temp" class="value">-- °C</div>
        </div>

        <!-- 2. Humidité -->
        <div class="card">
            <h3>Humidité</h3>
            <div id="client-humidity" class="value">-- %</div>
        </div>

        <!-- 3. Niveau de Gaz -->
        <div class="card">
            <h3>Niveau de Gaz</h3>
            <div id="client-gas" class="value">-- ppm</div>
        </div>

        <!-- 4. Statut Alerte Flamme -->
        <div class="card">
            <h3>Alerte Flamme</h3>
            <div id="flame-alert-badge" class="badge badge-success">SÉCURISÉ</div>
        </div>

        <!-- 5. Statut Alerte Gaz -->
        <div class="card">
            <h3>Alerte Fuite de Gaz</h3>
            <div id="gas-alert-badge" class="badge badge-success">SÉCURISÉ</div>
        </div>
    </div>

    <!-- Liaison avec votre script client.js -->
    <script src="client.js"></script>
</body>
</html>
